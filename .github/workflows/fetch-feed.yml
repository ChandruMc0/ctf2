name: fetch-feed
on:
  push:
    paths:
      - "tools/fetch_feed.py"
      - ".github/workflows/fetch-feed.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr python3-numpy python3-pil
      - name: analyze
        run: python3 tools/fetch_feed.py
      - name: ocr
        run: |
          cd analysis-out
          for f in spectrogram*.png; do
            echo "==== OCR $f"
            tesseract "$f" stdout --psm 6 || true
          done | tee ocr.txt
      - name: publish
        run: |
          rm -f analysis-out/*.ts analysis-out/feed.ts analysis-out/*.wav analysis-out/*.png
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add analysis-out/symbols.txt analysis-out/decode.txt analysis-out/playlist.m3u8 || true
          git commit -m "feed analysis output" || exit 0
          git push
